; ---------------------------------------------------------------------------
; Sized for this app specifically, not generic defaults.
; ---------------------------------------------------------------------------

; CV uploads are capped at 8 MB and photos at 4 MB by the app's own validation.
; These sit above that so oversized files are rejected by Laravel with a proper
; error message rather than by PHP with an empty $_POST.
upload_max_filesize = 16M
post_max_size = 20M
max_file_uploads = 5

; Parsing a large PDF with smalot/pdfparser is the memory high-water mark.
memory_limit = 512M

; A DeepSeek call is given 120s and retried once, so a worst-case AI request
; occupies a worker for just over four minutes before it gives up.
max_execution_time = 300
max_input_time = 120

expose_php = Off
date.timezone = UTC

[opcache]
opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; The code never changes inside a running container, so skip the stat() calls.
opcache.validate_timestamps = 0
opcache.enable_file_override = 1
