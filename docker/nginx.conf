user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $status $request_time "$request" "$http_user_agent"';
    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    server_tokens off;
    keepalive_timeout 65;

    # Above the app's 8 MB CV limit so Laravel returns the validation error
    # instead of nginx returning a bare 413.
    client_max_body_size 16m;
    client_body_timeout 120s;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml;

    server {
        listen 80 default_server;
        server_name _;
        root /var/www/html/public;
        index index.php;

        charset utf-8;

        # The reverse proxy in front terminates TLS and sets these.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        # Vite output is content-hashed, so it can be cached indefinitely.
        location /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Uploads served from the storage volume when Cloudinary is not configured.
        location /storage/ {
            expires 7d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ ^/index\.php(/|$) {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;

            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            fastcgi_param HTTPS $http_x_forwarded_proto if_not_empty;

            # An AI generation can legitimately run for minutes. The default 60s
            # here is what turns a slow DeepSeek call into a 504 for the user.
            fastcgi_read_timeout 310s;
            fastcgi_send_timeout 310s;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;

            fastcgi_hide_header X-Powered-By;
            internal;
        }

        # Nothing else in the tree is executable.
        location ~ \.php$ {
            return 404;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
