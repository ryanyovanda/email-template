[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000

pm = dynamic
; A stuck AI request holds a worker for minutes, so leave enough headroom that
; a handful of them cannot starve ordinary page loads.
pm.max_children = 24
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; Must exceed php.ini's max_execution_time or FPM kills the request first.
request_terminate_timeout = 310
request_slowlog_timeout = 30
slowlog = /proc/self/fd/2

catch_workers_output = yes
decorate_workers_output = no
clear_env = no

php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
