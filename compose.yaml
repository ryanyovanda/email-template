# =============================================================================
# ApplyMail — production stack
#
# Two ways to deploy this:
#
#   Portainer      Stacks -> Add stack -> Repository (or paste this file), then
#                  set the variables marked "required" under Environment.
#
#   docker compose cp deploy.env.example deploy.env, fill it in, then
#                  docker compose --env-file deploy.env up -d
#
#                  Building on the server instead of pulling a published image:
#                  docker compose --env-file deploy.env \
#                      -f compose.yaml -f compose.build.yaml up -d --build
#
# Pass --env-file explicitly. Compose otherwise reads ./.env, which in this repo
# is Laravel's *development* environment file, and its APP_KEY and APP_URL would
# silently become the deployed ones.
#
# Nothing below uses compose's "required variable" interpolation form. It is
# resolved while the file is *parsed*, which happens before Portainer applies a
# stack's environment variables, so a missing value failed the whole stack load
# with an interpolation error instead of a useful one. Required values are
# enforced by the entrypoint instead: it refuses to start and names every
# missing variable in the container logs.
# =============================================================================

services:

  app:
    # Required. Set it to your published image, e.g.
    #   ghcr.io/you/applymail:latest
    # The default below only exists so the file parses; it will not pull.
    image: ${APP_IMAGE:-applymail:latest}
    restart: unless-stopped

    # PHP-FPM is given time to finish an in-flight AI request rather than being
    # killed mid-generation on redeploy.
    stop_grace_period: 60s

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      APP_NAME: ${APP_NAME:-ApplyMail}
      APP_ENV: production
      APP_DEBUG: "false"
      # Required. Generate once with:
      #   docker run --rm ${APP_IMAGE} php artisan key:generate --show
      APP_KEY: ${APP_KEY:-}
      # Must be the public https:// address, or verification links point at localhost.
      APP_URL: ${APP_URL:-}

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-applymail}
      DB_USERNAME: ${DB_USERNAME:-applymail}
      DB_PASSWORD: ${DB_PASSWORD:-}

      SESSION_DRIVER: database
      SESSION_LIFETIME: "120"
      # The proxy terminates TLS, so cookies must be marked secure. Set this to
      # "false" only to smoke-test over plain http:// — with it left on, the
      # browser will not send the session cookie back and every login silently
      # fails.
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
      CACHE_STORE: database
      QUEUE_CONNECTION: database

      # --- Mail. Verification is on, so signups stall without this. ---
      MAIL_MAILER: smtp
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_SCHEME: ${MAIL_SCHEME:-tls}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
      MAIL_FROM_NAME: ${APP_NAME:-ApplyMail}

      # --- AI ---
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      # One generation may hold an FPM worker this long. See DEPLOY.md.
      DEEPSEEK_TIMEOUT: ${DEEPSEEK_TIMEOUT:-120}
      AI_RATE_LIMIT_PER_MINUTE: ${AI_RATE_LIMIT_PER_MINUTE:-3}
      AI_ABUSE_THRESHOLD_PER_DAY: ${AI_ABUSE_THRESHOLD_PER_DAY:-20}

      # --- Credits ---
      CREDIT_PRICE_APPLICATION_DRAFT: ${CREDIT_PRICE_APPLICATION_DRAFT:-10}
      CREDIT_PRICE_TEMPLATE_DESIGN: ${CREDIT_PRICE_TEMPLATE_DESIGN:-30}
      CREDIT_MONTHLY_GRANT: ${CREDIT_MONTHLY_GRANT:-300}
      CREDIT_PROMOTION_REWARD: ${CREDIT_PROMOTION_REWARD:-50}

      # --- Uploads. Without all three, files fall back to the local volume. ---
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-email-cv}

      # --- Seeded admin, created on first boot only. ---
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

      # Left blank the app derives this from APP_KEY, which means rotating
      # APP_KEY would invalidate every registered passkey. Set it once, to any
      # long random string, if rotation is ever on the cards.
      PASSKEYS_USER_HANDLE_SECRET: ${PASSKEYS_USER_HANDLE_SECRET:-}

      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-warning}

      # Nothing is queued or scheduled today; flip these if that changes.
      RUN_QUEUE_WORKER: ${RUN_QUEUE_WORKER:-false}
      RUN_SCHEDULER: ${RUN_SCHEDULER:-false}

    volumes:
      # Uploads (when Cloudinary is unset) and Laravel's writable tree.
      - app-storage:/var/www/html/storage

    ports:
      # Point your existing reverse proxy at this. Bind to localhost if the
      # proxy runs on the same host: "127.0.0.1:${APP_PORT:-8080}:80"
      - "${APP_PORT:-8080}:80"

    networks:
      - internal

    # --- Using Traefik instead of a port? Drop `ports:` above, attach the
    # --- proxy network below, and uncomment these.
    # labels:
    #   traefik.enable: "true"
    #   traefik.docker.network: proxy
    #   traefik.http.routers.applymail.rule: Host(`apply.example.com`)
    #   traefik.http.routers.applymail.entrypoints: websecure
    #   traefik.http.routers.applymail.tls.certresolver: letsencrypt
    #   traefik.http.services.applymail.loadbalancer.server.port: "80"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mysql:
    image: mysql:8.4
    restart: unless-stopped

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-applymail}
      MYSQL_USER: ${DB_USERNAME:-applymail}
      MYSQL_PASSWORD: ${DB_PASSWORD:-}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-}

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

    networks:
      - internal

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  app-storage:
  mysql-data:

networks:
  internal:
  # Uncomment together with the Traefik labels above.
  # proxy:
  #   external: true
