<table width="100%" cellpadding="0" cellspacing="0" border="0" role="presentation" style="background-color:#eef2f7; padding:24px 0; font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;">
  <tr>
    <td align="center">
      <table width="640" cellpadding="0" cellspacing="0" border="0" role="presentation" style="width:100%; max-width:640px; background-color:#ffffff; border-radius:14px; border:1px solid #dde3ec;">

        <tr>
          <td style="padding:26px 30px; background-color:{{ accent }}; border-radius:14px 14px 0 0;">
            <table width="100%" cellpadding="0" cellspacing="0" border="0" role="presentation">
              <tr>
                <td width="72" valign="top">
                  <img src="{{ photo_url }}" alt="{{ full_name }}" width="64" height="64" style="width:64px; height:64px; border-radius:32px; border:3px solid rgba(255,255,255,0.7); display:block;">
                </td>
                <td valign="middle" style="padding-left:16px;">
                  <div style="font-size:20px; font-weight:700; color:#ffffff;">{{ full_name }}</div>
                  <div style="font-size:13px; color:rgba(255,255,255,0.85); margin-top:4px;">{{ headline }}</div>
                  <div style="font-size:12px; color:rgba(255,255,255,0.75); margin-top:6px;">{{ location }} &middot; {{ phone }}</div>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <tr>
          <td style="padding:26px 30px 6px 30px;">
            <div style="font-size:11px; font-weight:700; letter-spacing:1.2px; color:{{ accent }}; text-transform:uppercase;">Applying for</div>
            <div style="font-size:17px; font-weight:600; color:#16202e; margin-top:5px;">{{ position }}</div>
            <div style="font-size:13px; color:#65758a; margin-top:2px;">{{ company }}</div>
          </td>
        </tr>

        <tr>
          <td style="padding:18px 30px 0 30px;">
            <p style="font-size:14px; line-height:1.75; color:#3c4a5c; margin:0 0 14px 0;">Hi {{ recipient_name }},</p>
            <p style="font-size:14px; line-height:1.75; color:#3c4a5c; margin:0 0 14px 0;">{{ pitch }}</p>
          </td>
        </tr>

        <tr>
          <td style="padding:6px 30px 0 30px;">
            <table width="100%" cellpadding="0" cellspacing="0" border="0" role="presentation" style="background-color:#f6f8fb; border-radius:10px;">
              <tr>
                <td style="padding:16px 18px;">
                  <div style="font-size:11px; font-weight:700; letter-spacing:1.2px; color:#8494a8; text-transform:uppercase;">Why me</div>
                  {{# proof_points }}<table width="100%" cellpadding="0" cellspacing="0" border="0" role="presentation"><tr>
                    <td width="16" valign="top" style="padding-top:9px; font-size:14px; color:{{ accent }}; line-height:1;">&bull;</td>
                    <td style="padding-top:8px; font-size:13px; line-height:1.65; color:#3c4a5c;">{{ . }}</td>
                  </tr></table>{{/ proof_points }}
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <tr>
          <td style="padding:18px 30px 0 30px;">
            <p style="font-size:14px; line-height:1.75; color:#3c4a5c; margin:0 0 14px 0;">{{ closing }}</p>
          </td>
        </tr>

        <tr>
          <td style="padding:8px 30px 26px 30px;">
            <table cellpadding="0" cellspacing="0" border="0" role="presentation">
              <tr>
                <td style="background-color:{{ accent }}; border-radius:8px;">
                  <a href="{{ portfolio_url }}" style="display:inline-block; padding:11px 22px; font-size:13px; font-weight:600; color:#ffffff; text-decoration:none;">View my portfolio</a>
                </td>
              </tr>
            </table>
            <div style="font-size:12px; color:#8494a8; margin-top:16px;">
              {{ full_name }} &middot; <a href="mailto:{{ contact_email }}" style="color:#8494a8;">{{ contact_email }}</a> &middot; CV attached
            </div>
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
